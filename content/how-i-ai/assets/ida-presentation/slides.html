<h1 id="failure-modes">Failure Modes</h1>
<div class="copy">
<ul>
<li><strong>Too much or too little context:</strong> it cannot read your mind</li>
<li><strong>Hallucination:</strong> plausible nonsense. Falsify early</li>
<li><strong>Overconfidence:</strong> fluent ≠ correct</li>
<li><strong>Context poisoning:</strong> early errors propagate</li>
<li><strong>Stale false memories:</strong> a MEMORY.md outside the repo</li>
<li><strong>Tool friction:</strong> confusing cruft builds up</li>
</ul>
</div>
<div class="figure">
<p><img src="assets/fig-domino-poisoning.svg" alt="An early incorrect fact poisons downstream context like falling dominoes" /></p>
</div>
<p class="nugget"><span>The calculator principle: <mark>deterministic work goes to deterministic tools</mark>.</span></p>

<div class="listing cmd">

<h1 id="backup-confine-it-then-let-it-run">Backup: Confine It, Then Let It Run</h1>
<div class="copy">
<ul>
<li><strong>Damage is a DontCare:</strong> sandboxes, containers, VMs; commit and push</li>
<li><strong>The biggest risk is leaking IP:</strong> no outbound network</li>
<li><strong>Packages through a gateway</strong> that delays and quarantines: hallucinated package names get squatted</li>
</ul>
</div>
<div class="figure">
<p><img src="assets/fig-confine.svg" alt="A sandbox holding the agent and a repo copy, outbound network crossed out, packages in through a delaying gateway, commits out to Git" /></p>
</div>
<p class="nugget"><span>Make errors <mark>unlikely, recoverable and confined</mark>.</span></p>
<footer><img class="logo" src="assets/ruvald-coral.svg" alt="RUVALD" /></footer>
