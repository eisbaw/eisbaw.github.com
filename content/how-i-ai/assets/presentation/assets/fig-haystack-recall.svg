  <g id="position-axis">
    <text class="label" transform="translate(21 220) rotate(-90)">Needle position in context (%)</text>
    <text class="tick position-tick" x="65" y="117">100</text>
    <text class="tick position-tick" x="65" y="141">80</text>
    <text class="tick position-tick" x="65" y="165">70</text>
    <text class="tick position-tick" x="65" y="189">60</text>
    <text class="tick position-tick" x="65" y="213">50</text>
