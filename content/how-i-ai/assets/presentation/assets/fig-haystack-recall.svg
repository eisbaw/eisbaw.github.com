<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="550" height="475" viewBox="0 0 550 475"
     role="img" aria-labelledby="haystack-title haystack-description">
  <title id="haystack-title">Needle-in-a-Haystack Recall</title>
  <desc id="haystack-description">An illustrative heatmap, not benchmark measurements.
    The source diagram's eight context-length buckets, ten needle-position rows, and
    eighty illustrative recall values are preserved. Short contexts retain high recall
    across positions. Longer contexts degrade most in the middle. Context grows from
    1k to 200k tokens left to right; needle position grows from 0 percent at the bottom
    to 100 percent at the top. Green means higher illustrative recall, red means lower.</desc>
  <defs>
    <linearGradient id="recall-scale" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b41e1e"/>
      <stop offset=".5" stop-color="#dca028"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Sans', Arial, sans-serif; fill: #23373b; text-anchor: middle; }
      .heading { font-size: 20px; font-weight: 600; }
      .label { font-size: 17px; }
      .tick { font-size: 16px; }
      .note { font-size: 16px; fill: #546568; }
      .position-tick { text-anchor: end; }
      .scale-tick { text-anchor: start; }
      .cell { stroke: #fff; stroke-width: 1; }
    </style>
  </defs>

  <g id="chart-heading">
    <text class="heading" x="275" y="29">Needle-in-a-Haystack Recall</text>
    <text class="note" x="275" y="54">Illustrative pattern, not measured results</text>
  </g>

