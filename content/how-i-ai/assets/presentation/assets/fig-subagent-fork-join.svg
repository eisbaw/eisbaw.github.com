<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="465" viewBox="0 0 1160 465"
     role="img" aria-labelledby="fork-join-title fork-join-description">
  <title id="fork-join-title">Sub-Agent Fork-Join: Telescoping and Distillation</title>
  <desc id="fork-join-description">A parent with accumulated context formulates a focused
    task and forks a sub-agent with a fresh, independent context. Illustrative token counts
    show a fifty-token prompt leading to fifty thousand tokens of exploration, implementation,
    testing, and iteration. The sub-agent distills its work into a roughly hundred-token
    conclusion. The parent joins that result and continues without importing the exploration
    history. The sample task searches for ConfigParser usages; its example result names
    three legacy API usages in config.py, settings.py, and loader.py.</desc>
  <defs>
    <marker id="agent-flow-arrow" viewBox="0 0 9 9" refX="9" refY="4.5"
            markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#527b2c"/>
    </marker>
    <style>
      text { font-family: 'Fira Sans', Arial, sans-serif; fill: #23373b; text-anchor: middle; }
      .title { font-size: 24px; font-weight: 600; }
      .heading { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; font-weight: 600; }
      .detail { font-size: 18px; }
      .note { font-size: 18px; fill: #546568; }
      .green { fill: #527b2c; }
      .flow { fill: none; stroke: #527b2c; stroke-width: 2; stroke-linejoin: round; }
      .step { fill: #eef2ed; stroke: #84a566; stroke-width: 1.3; }
    </style>
  </defs>

  <text class="title" x="580" y="31">Sub-Agent Fork-Join: Telescoping &amp; Distillation</text>

  <g id="parent-agent">
    <rect x="8" y="63" width="302" height="376" rx="12" fill="#f3f5f5" stroke="#8c9a9c" stroke-width="1.5"/>
    <text class="heading" x="159" y="93">Parent agent</text>
    <text class="note" x="159" y="124">Accumulated context</text>
    <g id="accumulated-history" fill="#ccd4d4">
      <rect x="36" y="140" width="246" height="6" rx="2"/>
      <rect x="36" y="151" width="220" height="6" rx="2"/>
      <rect x="36" y="162" width="235" height="6" rx="2"/>
    </g>
    <path class="flow" id="parent-continues-after-result" d="M 159 298 V 346" marker-end="url(#agent-flow-arrow)"/>
    <g id="focused-task">
      <rect x="28" y="178" width="262" height="120" rx="8" fill="#e9f2df" stroke="#84a566"/>
      <text class="label" x="159" y="204">Formulate task</text>
      <text class="detail" x="159" y="230">“Search for all usages</text>
      <text class="detail" x="159" y="254">of ConfigParser and</text>
      <text class="detail" x="159" y="278">report findings.”</text>
    </g>
    <g id="parent-uses-result">
      <rect x="28" y="346" width="262" height="78" rx="8" fill="#e9f2df" stroke="#84a566"/>
      <text class="label" x="159" y="370">Parent continues</text>
      <text class="detail" x="159" y="395">Uses the distilled result</text>
      <text class="detail" x="159" y="418">without exploration overhead</text>
    </g>
  </g>

  <g id="sub-agent">
    <rect x="532" y="63" width="620" height="376" rx="12" fill="#fff" stroke="#84a566" stroke-width="1.8"/>
    <text class="heading green" x="842" y="93">Sub-agent</text>
    <text class="note" x="842" y="120">Fresh, independent context</text>
    <text class="detail" x="842" y="148">~50k tokens explored</text>

    <!-- Iteration returns outside the phase boxes; distillation leaves the shared route. -->
    <g id="work-flow" class="flow">
      <path d="M 688 196 H 704" marker-end="url(#agent-flow-arrow)"/>
      <path d="M 848 196 H 864" marker-end="url(#agent-flow-arrow)"/>
      <path d="M 970 196 H 986" marker-end="url(#agent-flow-arrow)"/>
      <path id="iteration-feedback" d="M 1056 225 V 247 H 624 V 225" marker-end="url(#agent-flow-arrow)"/>
      <path id="compress-exploration" d="M 842 247 V 314" marker-end="url(#agent-flow-arrow)"/>
    </g>
    <g id="explore">
      <rect class="step" x="560" y="167" width="128" height="58" rx="7"/>
      <text class="label" x="624" y="203">Explore</text>
    </g>
    <g id="implement">
      <rect class="step" x="704" y="167" width="144" height="58" rx="7"/>
      <text class="label" x="776" y="203">Implement</text>
    </g>
    <g id="test">
      <rect class="step" x="864" y="167" width="106" height="58" rx="7"/>
      <text class="label" x="917" y="203">Test</text>
    </g>
    <g id="iterate">
      <rect class="step" x="986" y="167" width="140" height="58" rx="7"/>
      <text class="label" x="1056" y="203">Iterate</text>
    </g>
    <text class="detail" x="859" y="287" style="text-anchor: start">Distill</text>
    <g id="distilled-conclusion">
      <rect x="554" y="314" width="576" height="110" rx="8" fill="#e9f2df" stroke="#527b2c" stroke-width="1.5"/>
      <text class="label" x="842" y="339">Distilled conclusion</text>
      <text class="detail" x="842" y="365">“Found 3 ConfigParser usages: config.py:42,</text>
      <text class="detail" x="842" y="389">settings.py:17 and loader.py:88.</text>
      <text class="detail" x="842" y="413">All use the legacy API.”</text>
    </g>
  </g>

  <g id="fork">
    <text class="label green" x="421" y="211">FORK</text>
    <text class="detail" x="421" y="235">~50-token prompt</text>
    <path class="flow" d="M 290 253 H 532" marker-end="url(#agent-flow-arrow)"/>
  </g>
  <g id="join">
    <text class="label green" x="421" y="338">JOIN</text>
    <text class="detail" x="421" y="363">~100 tokens returned</text>
    <path class="flow" d="M 554 387 H 290" marker-end="url(#agent-flow-arrow)"/>
  </g>
  <text class="note" x="580" y="460">Illustrative token counts · exploration stays in the sub-agent’s context</text>
</svg>
