<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520"
     role="img" aria-labelledby="grounding-title grounding-description">
  <title id="grounding-title">Close the loop with tools that provide verifiable feedback</title>
  <desc id="grounding-description">An unavoidable first step is open-loop: a prompt goes
    through AI to an unvalidated output, with no grounding mechanism returning feedback.
    A closed loop sends output to a validation bank and returns the results to AI. The bank
    includes specification cross-references such as PRD section 3.2, real hardware for slow
    ground-truth checks, fast repeatable deterministic simulators, test suites, linters and
    static analysis, and a human review checkpoint. Choose grounding tools for the task;
    subjective confidence alone does not verify an output.</desc>
  <defs>
    <marker id="grounding-open-arrow" viewBox="0 0 8 8" refX="8" refY="4"
            markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#a64137"/>
    </marker>
    <marker id="grounding-closed-arrow" viewBox="0 0 8 8" refX="8" refY="4"
            markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#527b2c"/>
    </marker>
    <marker id="grounding-next-arrow" viewBox="0 0 8 8" refX="8" refY="4"
            markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#71807a"/>
    </marker>
    <style>
      text { font-family: 'Fira Sans', Arial, sans-serif; fill: #23373b; }
      .heading { font-size: 22px; font-weight: 600; }
      .label { font-size: 18px; text-anchor: middle; }
      .note { font-size: 18px; fill: #546568; }
      .open-ink { fill: #a64137; }
      .closed-ink { fill: #527b2c; }
      .open-node { fill: #fff; stroke: #c9867c; stroke-width: 1.4; }
      .closed-node { fill: #fff; stroke: #84a566; stroke-width: 1.4; }
      .open-flow { fill: none; stroke: #a64137; stroke-width: 1.8; }
      .closed-flow { fill: none; stroke: #527b2c; stroke-width: 1.8; stroke-linejoin: round; }
      .tool { font-size: 18px; font-weight: 600; }
    </style>
  </defs>

  <g id="open-loop">
    <rect x="8" y="8" width="500" height="459" rx="12" fill="#fff8f6" stroke="#e6cbc5"/>
    <text class="heading open-ink" x="28" y="39">Open-loop</text>
    <text class="note" x="28" y="66">Unavoidable first step</text>

    <g id="open-forward-flow" class="open-flow">
      <path d="M 141 114 H 214" marker-end="url(#grounding-open-arrow)"/>
      <path d="M 306 114 H 379" marker-end="url(#grounding-open-arrow)"/>
    </g>
    <!-- A visibly broken, unheaded return path denotes the absent feedback. -->
    <g id="absent-feedback">
      <path d="M 435 140 V 189 H 362 M 338 189 H 260 V 140"
            fill="none" stroke="#d6a69e" stroke-width="1.6" stroke-dasharray="5 5"/>
      <path d="M 341 180 L 359 198 M 341 198 L 359 180" fill="none" stroke="#a64137" stroke-width="2.2"/>
      <text class="label open-ink" x="350" y="229">No feedback</text>
    </g>
    <g id="open-prompt">
      <rect class="open-node" x="29" y="88" width="112" height="52" rx="7"/>
      <text class="label" x="85" y="121">Prompt</text>
    </g>
    <g id="open-ai">
      <rect x="214" y="88" width="92" height="52" rx="8" fill="#f8e7e2" stroke="#a64137" stroke-width="1.5"/>
      <text class="heading" x="260" y="122" text-anchor="middle">AI</text>
    </g>
    <g id="unvalidated-output">
      <rect class="open-node" x="379" y="88" width="112" height="52" rx="7" stroke-dasharray="5 4"/>
      <text class="label" x="435" y="111">Output</text>
      <text class="label open-ink" x="435" y="133">Unvalidated</text>
    </g>

    <g id="subjective-confidence">
      <rect x="29" y="269" width="462" height="123" rx="9" fill="#fff" stroke="#e6cbc5"/>
      <text class="label open-ink" x="260" y="298" font-weight="600">No grounding mechanisms</text>
      <text class="label" x="260" y="332">“Looks right” is a subjective judgement.</text>
      <text class="label" x="260" y="365">No measured result returns to the AI.</text>
    </g>
    <text class="note open-ink" x="258" y="437" text-anchor="middle">Initial answer · unverified result</text>
  </g>

  <g id="add-grounding">
    <text class="note" x="543" y="94" text-anchor="middle">then</text>
    <path d="M 519 114 H 567" fill="none" stroke="#71807a" stroke-width="2" marker-end="url(#grounding-next-arrow)"/>
  </g>

  <g id="closed-loop">
    <rect x="578" y="8" width="574" height="459" rx="12" fill="#f5f9f0" stroke="#cbdcbb"/>
    <text class="heading closed-ink" x="598" y="39">Closed-loop</text>
    <text class="note" x="598" y="66">Close the loop with reality</text>

    <g id="closed-forward-flow" class="closed-flow">
      <path d="M 728 114 H 800" marker-end="url(#grounding-closed-arrow)"/>
      <path d="M 900 114 H 995" marker-end="url(#grounding-closed-arrow)"/>
      <path id="output-to-validation-bank" d="M 1059 140 V 198" marker-end="url(#grounding-closed-arrow)"/>
      <path id="validation-feedback-to-ai" d="M 676 325 H 630 V 166 H 850 V 140" marker-end="url(#grounding-closed-arrow)"/>
    </g>
    <text class="note closed-ink" x="738" y="158" text-anchor="middle" font-weight="600">Feedback</text>
    <g id="closed-prompt">
      <rect class="closed-node" x="610" y="88" width="118" height="52" rx="7"/>
      <text class="label" x="669" y="121">Prompt</text>
    </g>
    <g id="closed-ai">
      <rect x="800" y="88" width="100" height="52" rx="8" fill="#e9f2df" stroke="#527b2c" stroke-width="1.5"/>
      <text class="heading" x="850" y="122" text-anchor="middle">AI</text>
    </g>
    <g id="closed-output">
      <rect class="closed-node" x="995" y="88" width="128" height="52" rx="7"/>
      <text class="label" x="1059" y="121">Output</text>
    </g>

    <g id="validation-bank">
      <rect x="676" y="198" width="447" height="254" rx="9" fill="#fff" stroke="#84a566" stroke-width="1.4"/>
      <text class="heading" x="899.5" y="226" text-anchor="middle" style="font-size: 20px">Validation bank</text>
      <path d="M 690 235 H 1109 M 690 270 H 1109 M 690 305 H 1109 M 690 340 H 1109
               M 690 375 H 1109 M 690 410 H 1109" fill="none" stroke="#e1e9dc"/>
      <g id="spec-cross-reference">
        <text class="tool" x="692" y="259">Spec cross-reference</text>
        <text class="note" x="934" y="259">PRD § 3.2</text>
      </g>
      <g id="real-hardware">
        <text class="tool" x="692" y="294">Real hardware</text>
        <text class="note" x="934" y="294">Slow · ground truth</text>
      </g>
      <g id="deterministic-simulator">
        <text class="tool" x="692" y="329">Deterministic simulator</text>
        <text class="note" x="934" y="329">Fast · repeatable</text>
      </g>
      <g id="test-suites">
        <text class="tool" x="692" y="364">Test suites</text>
        <text class="note" x="934" y="364">Pass / fail results</text>
      </g>
      <g id="static-analysis">
        <text class="tool" x="692" y="399">Linter / static analysis</text>
        <text class="note" x="934" y="399">Diagnostics</text>
      </g>
      <g id="human-review">
        <rect x="685" y="413" width="429" height="32" rx="4" fill="#fff6e5"/>
        <text class="tool" x="692" y="434" style="fill: #8c642e">Human review</text>
        <text class="note" x="934" y="434" style="fill: #8c642e">Checkpoint</text>
      </g>
    </g>
  </g>

  <g id="grounding-principle">
    <text class="label" x="580" y="502" style="font-size: 20px">Start open-loop. Close the loop with reality. Choose grounding tools for the task.</text>
  </g>
</svg>
